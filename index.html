<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#065f46">
<title>Keuangan IKPM Mekarjaya</title>
<link rel="icon" type="image/jpeg" href="image_5a2419.jpg">
<script>
  var currentTheme = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', currentTheme);
</script>
<style>
:root{--bg:#f3f4f6;--card:#fff;--tx:#111827;--mu:#6b7280;--bd:#e5e7eb;--pri:#059669;--pri2:#d1fae5;--in:#059669;--out:#dc2626;--hd:#065f46;--shadow:0 4px 12px rgba(0,0,0,.05);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
:root[data-theme="dark"]{--bg:#0f172a;--card:#1e293b;--tx:#f1f5f9;--mu:#94a3b8;--bd:#334155;--pri:#10b981;--pri2:#064e3b;--in:#34d399;--out:#f87171;--hd:#022c22;--shadow:0 4px 12px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:110px}
header{background:var(--hd);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.logo{width:46px;height:46px;object-fit:contain;flex:none;background:#fff;border-radius:50%;padding:2px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
header h1{font-size:17px;margin:0;font-weight:800;letter-spacing:-.5px}header small{opacity:.85;font-size:12px;font-weight:600;color:#d1fae5}header .sp{flex:1}
header button{padding:6px 10px;font-size:16px;background:rgba(255,255,255,.2);color:#fff}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);box-shadow:var(--shadow);border-radius:20px;padding:18px;margin-bottom:16px}
.hero{background:linear-gradient(135deg,#10b981,#047857);color:#fff;border:0;box-shadow:0 8px 24px rgba(16,185,129,.25)}
.hero h2{font-size:34px;margin:4px 0 14px;letter-spacing:-.5px;overflow-wrap:anywhere}.hero .r{display:flex;gap:18px;border-top:1px solid #ffffff44;padding-top:12px}.hero .r div{flex:1}.hero b{font-size:17px;display:block}
.grid{display:grid;gap:14px;grid-template-columns:1fr}@media(min-width:720px){.grid.c2{grid-template-columns:1fr 1fr}}
h3{margin:0 0 10px;font-size:16px;letter-spacing:-.3px}.mu{color:var(--mu);font-size:12px}
.row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px dashed var(--bd)}.row:last-child{border:0}.row .g{flex:1;min-width:0}.row .g b{display:block;overflow-wrap:anywhere}.row .g span{display:block}
.in{color:var(--in)}.out{color:var(--out)}.amt{font-weight:800;white-space:nowrap;font-size:15px}
button,select,input{font:inherit;color:var(--tx)}
input,select{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:12px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--pri);border-color:transparent}
button{border:0;border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--pri);color:#fff;transition:.15s}
button:active{transform:scale(.96)}button:disabled{opacity:.5}
button.s{background:var(--pri2);color:var(--pri)}button.d{background:var(--bg);color:var(--out);padding:8px 10px;border:1px solid var(--bd)}
.chip{font-size:11px;font-weight:800;padding:4px 10px;border-radius:99px;letter-spacing:.5px;display:inline-block}.ok{background:#10b98122;color:var(--in)}.no{background:#ef444422;color:var(--out)}
.bar{display:flex;gap:6px;align-items:flex-end;height:120px;margin-top:6px}.bar div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px;font-size:10px;color:var(--mu)}.bar i{display:block;width:100%;border-radius:6px 6px 0 0;min-height:2px}
.table-container{overflow-x:auto;margin:0 -18px;border-top:1px solid var(--bd)}
.kas-table{width:100%;border-collapse:collapse;font-size:13px}
.kas-table th{background:var(--bg);color:var(--mu);text-align:left;padding:12px 14px;font-weight:600;border-bottom:1px solid var(--bd);white-space:nowrap}
.kas-table td{padding:12px 14px;border-bottom:1px dashed var(--bd);vertical-align:middle}
.kas-table tr:last-child td{border-bottom:0}.kas-table .r{text-align:right;white-space:nowrap}
.kas-table tbody tr:hover{background:var(--bg)}
nav{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:12px;right:12px;max-width:520px;margin:0 auto;background:var(--card);border:1px solid var(--bd);border-radius:24px;display:flex;justify-content:space-around;padding:6px;z-index:6;box-shadow:var(--shadow)}
nav button{background:transparent;color:var(--mu);font-size:10.5px;display:flex;flex-direction:column;gap:2px;align-items:center;padding:7px 8px;border-radius:16px;font-weight:600;flex:1}
nav button.a{background:var(--pri2);color:var(--pri)}nav span{font-size:20px}
.f{display:grid;gap:12px}.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.tabs button{background:var(--bg);color:var(--mu);border:1px solid var(--bd)}.tabs button.a{background:var(--pri);color:#fff;border-color:var(--pri)}
#toast{position:fixed;top:calc(74px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:10px 20px;border-radius:99px;z-index:60;display:none;box-shadow:0 4px 12px rgba(0,0,0,.25);font-weight:600;font-size:13px;max-width:92vw;text-align:center}
.top{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap}.top select{width:auto;padding:8px 12px}
.empty{text-align:center;color:var(--mu);padding:22px 8px}
.ovl{position:fixed;inset:0;background:#000a;z-index:30;overflow:auto;padding:16px;display:grid;place-items:center}
body:not(.isadmin) .adm{display:none!important}
#rep{position:fixed;inset:0;background:#fff;color:#111;overflow:auto;z-index:40;font:12px/1.5 Georgia,"Times New Roman",serif}
#rep .tb{position:sticky;top:0;background:#f3f4f6;padding:12px 16px;display:flex;gap:8px;border-bottom:1px solid #e5e7eb}
#rep .pg{max-width:820px;margin:0 auto;padding:30px}
#rep .kop{display:flex;gap:16px;align-items:center;border-bottom:3px double #111;padding-bottom:12px;margin-bottom:16px;font-size:15px}#rep .kop img{height:72px;width:auto}
#rep h4{margin:20px 0 6px;font-size:14px}
#rep table{width:100%;border-collapse:collapse;margin:8px 0 16px}#rep th,#rep td{border:1px solid #555;padding:6px 8px;text-align:left}#rep th{background:#f3f4f6}#rep .r{text-align:right}#rep tr{break-inside:avoid}#rep .sum{width:70%}
#rep .ttd{display:flex;justify-content:space-between;margin-top:40px;text-align:center;break-inside:avoid}
@media print{body>*:not(#rep){display:none!important}body{padding:0;background:#fff}#rep{position:static;overflow:visible}#rep .tb{display:none}#rep .pg{padding:0;max-width:none}@page{size:A4;margin:14mm}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <img class="logo" alt="Logo IKPM" src="image_5a2419.jpg" onerror="this.style.display='none'">
  <div><h1>Keuangan IKPM</h1><small>Ikatan Pemuda Mekarjaya</small></div>
  <div class="sp"></div>
  <small id="st">memuat…</small>
  <button onclick="toggleTheme()" title="Ubah tema" aria-label="Ubah tema">🌓</button>
  <button id="lg" onclick="authBtn()" title="Masuk Admin" aria-label="Masuk Admin">🔑</button>
</header>
<main id="v"></main>
<div id="toast"></div>
<nav id="nav"></nav>
<script src="config.js"></script>
<script>
function toggleTheme(){var t=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';document.documentElement.setAttribute('data-theme',t);localStorage.setItem('theme',t)}
const $=s=>document.querySelector(s),rp=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n||0);
const esc=s=>String(s!=null?s:'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let IURAN=25000;const BUNGA=.3,BULAN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'],RTS=['RT Mekarjaya','RT Cipancur'];
const S={tab:'home',year:String(new Date().getFullYear()),tx:[],mem:[],loan:[],iur:[],coll:false,admin:false,uid:'',db:null,user:null,q:'',rt:'semua',filt:'semua',loanTab:'aktif',ld:{}};
const today=()=>new Date().toISOString().slice(0,10),CY=()=>new Date().getFullYear();
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3200)}
const yearOf=t=>(t.date||'').slice(0,4);
const allTx=()=>S.tx.filter(t=>!t.id.startsWith('iuran_')).concat(S.iur.map(i=>({id:'i_'+i.id,virtual:1,type:'income',amount:i.amount||IURAN,category:i.kind==='donasi'?'Donasi':'Iuran Anggota Tetap',description:i.kind==='donasi'?`Donasi - ${i.name}`:`Iuran ${i.year} - ${i.name}`,date:i.date||'',createdAt:i.date||''})));
const years=()=>{const a=new Set(Array.from({length:Math.max(9,CY()-2022+3)},(_,i)=>String(2022+i)));allTx().forEach(t=>{const y=yearOf(t);if(y)a.add(y)});return[...a].sort().reverse()};
const sync=()=>{S.mem.forEach(m=>{m.iuran={};m.don=[]});S.iur.forEach(i=>{const m=S.mem.find(x=>x.id===i.memberId);if(!m)return;if(i.kind==='donasi')m.don.push(i);else m.iuran[i.year]=i})};
const ftx=()=>allTx().filter(t=>S.year==='all'||yearOf(t)===S.year).sort((a,b)=>(b.date+b.createdAt).localeCompare(a.date+a.createdAt));
const sg=x=>x.type==='income'?x.amount:-x.amount;
async function w(fn,ok,lvl){const allowed=lvl==='coll'?S.coll:S.admin;if(!S.db||!allowed)return toast(lvl==='coll'?'Anda tidak punya izin mencatat.':'Hanya Admin yang dapat mengubah data.');try{await fn();ok&&toast(ok)}catch(e){toast('Gagal menyimpan: '+(e.message||e.code))}}
const col=n=>S.db.collection(n);
const addTx=o=>col('transactions').add(Object.assign({},o,{createdAt:new Date().toISOString()}));
const yearSel=()=>`<select onchange="S.year=this.value;R()" aria-label="Pilih tahun"><option value="all"${S.year==='all'?' selected':''}>Semua Tahun</option>${years().map(y=>`<option${y===S.year?' selected':''}>${y}</option>`).join('')}</select>`;
const searchBox=ph=>`<input placeholder="${ph}" value="${esc(S.q)}" oninput="S.q=this.value;clearTimeout(S._d);S._d=setTimeout(()=>{R();const e=$('#q');e&&(e.focus(),e.setSelectionRange(99,99))},250)" id="q">`;

/* ---- tunggakan ---- */
const since=m=>+(m.since||2022);
const tagihan=(m,y)=>(m.tagihan&&m.tagihan[y]!==undefined)?Number(m.tagihan[y]):IURAN;
const arrears=m=>{if(m.role!=='Anggota Tetap')return[];const r=[];for(let y=since(m);y<CY();y++)if(!(m.iuran&&m.iuran[y]))r.push(String(y));return r};
const arrearSum=m=>arrears(m).reduce((a,y)=>a+tagihan(m,y),0);
const getIuranAmt=(m,y)=>(m.iuran&&m.iuran[y]&&m.iuran[y].amount)?m.iuran[y].amount:tagihan(m,y);
const piutang=l=>l.total-(l.paidAmount||0);

/* ---- beranda ---- */
function home(){const t=ftx(),i=t.filter(x=>x.type==='income').reduce((a,x)=>a+x.amount,0),o=t.filter(x=>x.type==='expense').reduce((a,x)=>a+x.amount,0);
 const mo=BULAN.map((_,m)=>{const f=t.filter(x=>+x.date.slice(5,7)===m+1);return[f.filter(x=>x.type==='income').reduce((a,x)=>a+x.amount,0),f.filter(x=>x.type==='expense').reduce((a,x)=>a+x.amount,0)]});
 const mx=Math.max(1,...mo.flat()),aktif=S.loan.filter(l=>l.status==='unpaid'),piut=aktif.reduce((a,l)=>a+piutang(l),0);
 const tetap=S.mem.filter(m=>m.role==='Anggota Tetap'),lun=S.year==='all'?0:tetap.filter(m=>m.iuran&&m.iuran[S.year]).length,tg=S.mem.filter(m=>arrears(m).length);
 return `<div class="top"><h3 style="margin:0">Ringkasan</h3>${yearSel()}</div>
 <div class="card hero"><div class="mu" style="color:#d1fae5">Saldo Kas (${S.year==='all'?'Semua Tahun':S.year})</div><h2>${rp(i-o)}</h2><div class="r"><div><span class="mu" style="color:#d1fae5">Pemasukan</span><b>${rp(i)}</b></div><div><span class="mu" style="color:#d1fae5">Pengeluaran</span><b>${rp(o)}</b></div></div></div>
 <div class="grid c2"><div class="card"><h3>Piutang Pinjaman</h3><b style="font-size:20px">${rp(piut)}</b><div class="mu">${aktif.length} pinjaman belum lunas</div></div>
 <div class="card"><h3>Iuran Anggota Tetap</h3><b style="font-size:20px">${S.year==='all'?'—':lun+' / '+tetap.length}</b><div class="mu">${S.year==='all'?'Pilih satu tahun untuk melihat':'sudah lunas tahun '+S.year}${tg.length?` • <span class="out">${tg.length} orang menunggak</span>`:''}</div></div></div>
 ${S.year==='all'?'':`<div class="card"><h3>Arus Kas per Bulan</h3><div class="bar">${mo.map((m,k)=>`<div title="${BULAN[k]}"><span style="display:flex;gap:2px;align-items:flex-end;height:96px;width:100%"><i style="background:var(--in);height:${m[0]/mx*100}%"></i><i style="background:var(--out);height:${m[1]/mx*100}%"></i></span>${BULAN[k]}</div>`).join('')}</div><div class="mu"><span class="in">■</span> Masuk &nbsp;<span class="out">■</span> Keluar</div></div>`}
 <div class="card"><h3>Mutasi Terbaru</h3>${t.slice(0,5).map(txRow).join('')||'<div class="empty">Belum ada transaksi.</div>'}</div>`}
const txRow=x=>`<div class="row"><div class="g"><b>${esc(x.description)}</b><span class="mu">${esc(x.date)} • ${esc(x.category)}</span></div><span class="amt ${x.type==='income'?'in':'out'}">${x.type==='income'?'+':'−'}${rp(x.amount)}</span></div>`;

/* ---- buku kas ---- */
function kas(){const prev=S.year==='all'?0:allTx().filter(x=>yearOf(x)<S.year).reduce((a,x)=>a+sg(x),0);
 let cur=prev;const asc=ftx().slice().sort((a,b)=>(a.date+a.createdAt).localeCompare(b.date+b.createdAt)).map(x=>(cur+=sg(x),Object.assign({},x,{saldo:cur})));
 const q=S.q.toLowerCase(),t=asc.filter(x=>!q||(x.description+x.category).toLowerCase().includes(q));
 const rows=t.map(x=>{const inc=x.type==='income';return `<tr><td style="white-space:nowrap">${esc(x.date)}</td><td><b>${esc(x.description)}</b><br><small class="mu">${esc(x.category)}</small></td><td class="r in">${inc?rp(x.amount):'-'}</td><td class="r out">${inc?'-':rp(x.amount)}</td><td class="r"><b>${rp(x.saldo)}</b></td>${S.admin?`<td style="text-align:center">${x.virtual?'':`<button class="d" onclick="delTx('${x.id}')" aria-label="Hapus">🗑</button>`}</td>`:''}</tr>`}).join('');
 return `<div class="top"><h3 style="margin:0">Buku Kas Umum</h3>${yearSel()}</div>
 <div class="card">${searchBox('Cari transaksi…')}<div class="adm" style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="s" onclick="csv()">⬇ Ekspor CSV</button><button class="s" onclick="laporan()">🖨 Laporan (PDF)</button></div></div>
 <div class="card" style="padding-bottom:0"><div class="table-container"><table class="kas-table"><thead><tr><th>Tanggal</th><th>Uraian</th><th class="r">Masuk</th><th class="r">Keluar</th><th class="r">Saldo</th>${S.admin?'<th></th>':''}</tr>
 ${S.year!=='all'?`<tr><td colspan="4" class="mu"><i>Saldo pindahan tahun sebelumnya</i></td><td class="r"><b>${rp(prev)}</b></td>${S.admin?'<td></td>':''}</tr>`:''}</thead>
 <tbody>${rows||`<tr><td colspan="${S.admin?6:5}" class="empty">Tidak ada data transaksi.</td></tr>`}</tbody></table></div></div>`}
function delTx(id){const x=S.tx.find(t=>t.id===id);if(x&&(x.loanId||id.startsWith('out_')))return toast('Transaksi pinjaman dihapus lewat menu Pinjaman.');if(confirm('Hapus transaksi ini?'))w(()=>col('transactions').doc(id).delete(),'Transaksi dihapus.')}
async function csv(){if(!S.admin)return;const rows=[['Tanggal','Jenis','Kategori','Keterangan','Nominal'],...ftx().map(x=>[x.date,x.type==='income'?'Masuk':'Keluar',x.category,x.description,x.amount])];
 await DL.save({filename:`kas-ikpm-${S.year}.csv`,data:toCsv(rows)})}
const toCsv=rows=>rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');

/* ---- catat ---- */
let CATAT_TAB='iuran';
function setCatatTab(t){CATAT_TAB=t;R()}
const fillAmt=()=>{const m=S.mem.find(x=>x.id===$('#c_mem').value);if(m&&$('#c_jenis').value==='iuran')$('#c_am').value=tagihan(m,$('#c_year').value)};
function add(){if(!S.coll)return `<div class="card">Fitur ini khusus Pengurus.</div>`;if(!S.admin)CATAT_TAB='iuran';
 const cats=CATAT_TAB==='income'?['Donasi Umum','Kasaran','Lainnya']:['Kasaran / Operasional','Perlengkapan','Konsumsi','Lainnya'];
 const form=CATAT_TAB==='iuran'?`<select id="c_mem" onchange="fillAmt()"><option value="">— Pilih Anggota —</option>${S.mem.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(m=>`<option value="${m.id}">${esc(m.name)} (${esc(m.rt)})</option>`).join('')}</select>
 <select id="c_jenis" onchange="fillAmt()"><option value="iuran">Iuran Wajib (Anggota Tetap)</option><option value="donasi">Donasi</option></select>
 <label class="mu">Untuk tahun</label><select id="c_year" onchange="fillAmt()">${years().filter(y=>+y<=CY()).map(y=>`<option value="${y}"${y===(S.year==='all'?String(CY()):S.year)?' selected':''}>Tahun ${y}</option>`).join('')}</select>
 <input id="c_am" type="number" inputmode="numeric" placeholder="Nominal bayar (Rp)"><input id="c_dt" type="date" value="${today()}"><button onclick="saveCatatIuran()">Simpan Pembayaran</button>`
 :`<input id="c_am" type="number" inputmode="numeric" min="1" placeholder="Nominal (Rp)"><select id="c_ct">${cats.map(c=>`<option>${c}</option>`).join('')}</select><input id="c_ds" placeholder="Keterangan"><input id="c_dt" type="date" value="${today()}"><button onclick="saveCatatTx('${CATAT_TAB}')">Simpan Transaksi</button>`;
 return `<div class="card" style="max-width:520px;margin:auto"><h3>Catat Transaksi</h3><div class="f">
 <div class="tabs" style="display:grid;grid-template-columns:repeat(${S.admin?3:1},1fr);gap:4px"><button class="${CATAT_TAB==='iuran'?'a':''}" onclick="setCatatTab('iuran')">Iuran/Donasi</button>${S.admin?`<button class="${CATAT_TAB==='income'?'a':''}" onclick="setCatatTab('income')">Pemasukan</button><button class="${CATAT_TAB==='expense'?'a':''}" onclick="setCatatTab('expense')">Pengeluaran</button>`:''}</div>${form}</div></div>`}
function saveCatatIuran(){const mId=$('#c_mem').value,jenis=$('#c_jenis').value,y=$('#c_year').value,a=+$('#c_am').value,dt=$('#c_dt').value,m=S.mem.find(x=>x.id===mId);
 if(!m)return toast('Pilih anggota terlebih dahulu.');if(!(a>0)||!dt)return toast('Isi nominal dan tanggal dengan benar.');
 if(jenis==='iuran'){if(m.role!=='Anggota Tetap')return toast('Iuran wajib hanya untuk Anggota Tetap. Pilih Donasi.');if(m.iuran&&m.iuran[y]&&!confirm(`Iuran ${y} untuk ${m.name} sudah tercatat. Timpa dengan data baru?`))return}
 w(async()=>{const base={memberId:m.id,name:m.name,rt:m.rt,year:y,date:dt,amount:a,by:S.uid};
  if(jenis==='donasi')await col('iuran').add(Object.assign({kind:'donasi'},base));else await col('iuran').doc(`${m.id}_${y}`).set(base);
  S.tab='home';R()},'Pembayaran berhasil dicatat.','coll')}
function saveCatatTx(type){const a=+$('#c_am').value,d=$('#c_ds').value.trim(),dt=$('#c_dt').value,ct=$('#c_ct').value;if(!(a>0)||!d||!dt)return toast('Lengkapi nominal, keterangan, dan tanggal.');
 w(async()=>{await addTx({type,amount:a,category:ct,description:d,date:dt});S.tab='home';R()},'Transaksi dicatat.')}

/* ---- anggota ---- */
function members(){const y=S.year,per=y!=='all';
 const ok=m=>(S.rt==='semua'||m.rt===S.rt)&&(!S.q||m.name.toLowerCase().includes(S.q.toLowerCase()))&&(S.filt==='semua'||(S.filt==='tunggak'?arrears(m).length>0:!per||(m.role==='Anggota Tetap'&&(S.filt==='lunas')===!!(m.iuran&&m.iuran[y]))));
 const f=S.mem.filter(ok).sort((a,b)=>a.name.localeCompare(b.name)),tg=S.mem.filter(m=>arrears(m).length),tgSum=tg.reduce((a,m)=>a+arrearSum(m),0);
 const card=m=>{const ar=arrears(m),dn=(m.don||[]).filter(d=>d.year===y).reduce((a,d)=>a+d.amount,0),lunas=m.iuran&&m.iuran[y];

 ${S.admin?`<div class="card"><h3>Tambah Anggota</h3><div class="f"><input id="mn" placeholder="Nama lengkap"><select id="mr">${RTS.map(r=>`<option>${r}</option>`).join('')}</select><select id="mo"><option>Anggota Tetap</option><option>Anggota Donatur</option></select><label class="mu">Mulai iuran tahun</label><select id="ms">${Array.from({length:CY()-2021},(_,k)=>`<option${2022+k===CY()?' selected':''}>${2022+k}</option>`).join('')}</select><button onclick="addMem()">Simpan</button></div></div>`:''}
 <div class="card">${f.map(card).join('')||'<div class="empty">Tidak ada anggota.</div>'}</div>`}

 const ys=[];for(let k=Math.min(since(m),+y,cy);k<=Math.max(cy,+y);k++)ys.push(String(k));

 <label class="mu">Donasi tahun ${y}</label>${dons.map(d=>`<div class="row"><div class="g">${esc(d.date)}</div><b>${rp(d.amount)}</b><button class="d" onclick="delDon('${d.id}')" aria-label="Hapus">🗑</button></div>`).join('')||'<div class="mu">Belum ada donasi.</div>'}

 return{rt,m,total:m.length,tetap:t.length,donatur:m.length-t.length,lunas:l.length,belum:t.filter(x=>!(x.iuran&&x.iuran[y])),kas:l.reduce((a,x)=>a+getIuranAmt(x,y),0),don:m.reduce((a,x)=>a+(x.don||[]).filter(d=>d.year===y).reduce((b,d)=>b+d.amount,0),0),tg:t.filter(x=>arrears(x).length),target:t.reduce((a,x)=>a+tagihan(x,y),0)}})}

(async()=>{R();

 if(!api){toast('Tidak dapat terhubung ke Firebase.');return}
 S.db=api;

 const sub=(n,k)=>col(n).onSnapshot(s=>{S[k]=s.docs.map(d=>Object.assign({id:d.id},d.data()));S.ld[k]=1;sync();R()},()=>{S.ld[k]=1;toast('Gagal memuat data '+n+' (cek aturan Firestore).');R()});

})();

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";
import {getFirestore,collection,doc,addDoc,setDoc,updateDoc,deleteDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyDKdHZuDvacrMT_Y3YZLMRArggCjay1VD8",authDomain:"ikpm-catatan-keuangan.firebaseapp.com",projectId:"ikpm-catatan-keuangan",storageBucket:"ikpm-catatan-keuangan.firebasestorage.app",messagingSenderId:"449843262104",appId:"1:449843262104:web:9f751f532a98e50bb596ed"});
const db=getFirestore(app),auth=getAuth(app);
const ref=(n,id)=>id?doc(db,n,id):doc(collection(db,n));
window.fbResolve({
 collection:n=>({doc:id=>{const r=ref(n,id);return{id:r.id,set:d=>setDoc(r,d),update:d=>updateDoc(r,d),delete:()=>deleteDoc(r)}},
  add:d=>addDoc(collection(db,n),d),
  onSnapshot:(f,e)=>onSnapshot(collection(db,n),q=>f({docs:q.docs.map(x=>({id:x.id,data:()=>x.data()}))}),e||(()=>{}))}),
 onAuth:f=>onAuthStateChanged(auth,f),login:(e,p)=>signInWithEmailAndPassword(auth,e,p),logout:()=>signOut(auth)});
</script>
