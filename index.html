<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keuangan IKPM Mekarjaya</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2333;--mu:#6b7487;--bd:#e4e8f1;--pri:#1d4ed8;--pri2:#dbe6ff;--in:#059669;--out:#e11d48;--hd:#1e3a8a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1420;--card:#18202f;--tx:#e8ecf5;--mu:#93a0b8;--bd:#27324a;--pri:#6ea0ff;--pri2:#1f2f55;--in:#34d399;--out:#fb7185;--hd:#0b1226;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0f1420;--card:#18202f;--tx:#e8ecf5;--mu:#93a0b8;--bd:#27324a;--pri:#6ea0ff;--pri2:#1f2f55;--in:#34d399;--out:#fb7185;--hd:#0b1226;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
header{background:var(--hd);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
img.logo{border:0;border-radius:0;background:none;width:auto;height:46px;object-fit:contain;filter:drop-shadow(0 1px 3px #0006)}
.logo{width:44px;height:44px;border-radius:50%;border:2px solid #facc15;display:grid;place-items:center;font-size:8px;font-weight:800;color:#facc15;text-align:center;line-height:1.1;flex:none;background:#1e3a8a}
header h1{font-size:16px;margin:0}header small{opacity:.7;font-size:11px}header .sp{flex:1}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px}
.hero{background:linear-gradient(135deg,#2563eb,#1e3a8a);color:#fff;border:0}
.hero h2{font-size:32px;margin:4px 0 14px}.hero .r{display:flex;gap:18px;border-top:1px solid #ffffff44;padding-top:12px}.hero .r div{flex:1}.hero b{font-size:17px;display:block}
.grid{display:grid;gap:14px;grid-template-columns:1fr}@media(min-width:720px){.grid.c2{grid-template-columns:1fr 1fr}}
h3{margin:0 0 10px;font-size:15px}.mu{color:var(--mu);font-size:12px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}.row .g{flex:1;min-width:0}.row .g b{display:block;overflow-wrap:anywhere}
.in{color:var(--in)}.out{color:var(--out)}.amt{font-weight:800;white-space:nowrap}
button,select,input{font:inherit;color:var(--tx)}
input,select{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px}
button{border:0;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;background:var(--pri);color:#fff}
button.s{background:var(--pri2);color:var(--pri)}button.d{background:transparent;color:var(--mu);padding:6px 8px}button:disabled{opacity:.5}
.chip{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;border:0}.ok{background:#05966922;color:var(--in)}.no{background:#e11d4822;color:var(--out)}
.bar{display:flex;gap:6px;align-items:flex-end;height:120px;margin-top:6px}.bar div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:2px;font-size:10px;color:var(--mu)}.bar i{display:block;width:100%;border-radius:4px 4px 0 0;min-height:1px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
nav button{background:none;color:var(--mu);font-size:11px;display:flex;flex-direction:column;gap:2px;align-items:center;padding:6px 10px}nav button.a{color:var(--pri)}nav span{font-size:18px}
.f{display:grid;gap:10px}.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.tabs button{background:var(--pri2);color:var(--pri)}.tabs button.a{background:var(--pri);color:#fff}
#toast{position:fixed;top:calc(70px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:8px 16px;border-radius:99px;z-index:20;display:none}
.top{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap}.top select{width:auto}
body:not(.isadmin) .adm{display:none!important}
#rep{position:fixed;inset:0;background:#fff;color:#111;overflow:auto;z-index:40;font:12px/1.5 Georgia,"Times New Roman",serif}
#rep .tb{position:sticky;top:0;background:#eef1f7;padding:8px 16px;display:flex;gap:8px;border-bottom:1px solid #ccd}
#rep .pg{max-width:820px;margin:0 auto;padding:24px}
#rep .kop{display:flex;gap:14px;align-items:center;border-bottom:3px double #111;padding-bottom:10px;margin-bottom:12px;font-size:14px}#rep .kop img{height:68px;width:auto}
#rep h4{margin:16px 0 4px;font-size:13px}
#rep table{width:100%;border-collapse:collapse;margin:6px 0 10px}#rep th,#rep td{border:1px solid #888;padding:4px 6px;text-align:left}#rep th{background:#e6ebf5}#rep .r{text-align:right}#rep tr{break-inside:avoid}#rep .sum{width:60%}
#rep .ttd{display:flex;justify-content:space-between;margin-top:30px;text-align:center;break-inside:avoid}
@media print{body>*:not(#rep){display:none!important}body{padding:0;background:#fff}#rep{position:static;overflow:visible}#rep .tb{display:none}#rep .pg{padding:0;max-width:none}@page{size:A4;margin:14mm}}

<script>
const $=s=>document.querySelector(s),rp=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n||0);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const IURAN=25000,BUNGA=.3,BULAN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const S={tab:'home',year:String(new Date().getFullYear()),tx:[],mem:[],loan:[],iur:[],coll:false,uid:'',admin:false,db:null,q:'',rt:'semua',filt:'semua',ready:false,loanTab:'aktif'};
const today=()=>new Date().toISOString().slice(0,10);
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2800)}
const yearOf=t=>(t.date||'').slice(0,4);
const years=()=>{const a=new Set(Array.from({length:9},(_,i)=>String(2022+i)));allTx().forEach(t=>a.add(yearOf(t)));return[...a].filter(Boolean).sort().reverse()};
const allTx=()=>S.tx.filter(t=>!t.id.startsWith('iuran_')).concat(S.iur.map(i=>({id:'i_'+i.id,virtual:1,type:'income',amount:i.amount||IURAN,category:i.kind==='donasi'?'Donasi':'Iuran Anggota Tetap',description:i.kind==='donasi'?`Donasi - ${i.name}`:`Iuran ${i.year} - ${i.name}`,date:i.date,createdAt:i.date})));
const sync=()=>{S.mem.forEach(m=>{m.iuran={};m.don=[]});S.iur.forEach(i=>{const m=S.mem.find(x=>x.id===i.memberId);if(!m)return;if(i.kind==='donasi')m.don.push(i);else m.iuran[i.year]=i})};
const ftx=()=>allTx().filter(t=>S.year==='all'||yearOf(t)===S.year).sort((a,b)=>(b.date+b.createdAt).localeCompare(a.date+a.createdAt));
async function w(fn,ok){if(!S.db||!S.admin)return toast('Hanya Admin yang dapat mengubah data.');try{await fn();ok&&toast(ok)}catch(e){toast('Gagal menyimpan: '+(e.message||e.code))}}
const col=n=>S.db.collection(n);
const addTx=(o)=>col('transactions').add({...o,createdAt:new Date().toISOString()});
function yearSel(){return `<select onchange="S.year=this.value;R()"><option value="all"${S.year==='all'?' selected':''}>Semua Tahun</option>${years().map(y=>`<option${y===S.year?' selected':''}>${y}</option>`).join('')}</select>`}
function home(){const t=ftx(),i=t.filter(x=>x.type==='income').reduce((a,x)=>a+x.amount,0),o=t.filter(x=>x.type==='expense').reduce((a,x)=>a+x.amount,0);
 const mo=BULAN.map((_,m)=>{const k=m+1;const f=t.filter(x=>+x.date.slice(5,7)===k);return[f.filter(x=>x.type==='income').reduce((a,x)=>a+x.amount,0),f.filter(x=>x.type==='expense').reduce((a,x)=>a+x.amount,0)]});
 const mx=Math.max(1,...mo.flat());
 const aktif=S.loan.filter(l=>l.status==='unpaid'),piut=aktif.reduce((a,l)=>a+l.total,0);
 const tetap=S.mem.filter(m=>m.role==='Anggota Tetap'),lun=S.year==='all'?0:tetap.filter(m=>m.iuran?.[S.year]).length;

async function csvRekap(rt){if(!S.admin)return;const d=DL;if(!d)return toast('Unduh tidak tersedia di tampilan ini.');
 const rows=[['RT','Nama','Peran','Iuran '+S.year,'Nominal'],...rekapData().filter(x=>!rt||x.rt===rt).flatMap(x=>x.m.map(m=>[x.rt,m.name,m.role,m.role==='Anggota Tetap'?(m.iuran?.[S.year]?'Lunas':'Belum'):'-',m.role==='Anggota Tetap'&&m.iuran?.[S.year]?(m.iuran[S.year].amount||IURAN):0]))];
 const data=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
 try{await d.save({filename:`rekap-iuran-${rt?rt.replace(' ','-'):'semua-rt'}-${S.year}.csv`,data})}catch(e){}}

function R(){if(S.tab==='add'&&!S.admin)S.tab='home';document.body.classList.toggle('isadmin',!!S.admin);$('#nav').innerHTML=TABS.filter(t=>t[0]!=='add'||S.admin).map(([k,i,l])=>`<button class="${S.tab===k?'a':''}" onclick="go('${k}')"><span>${i}</span>${l}</button>`).join('');
 $('#v').innerHTML=!S.db?`<div class="card">Memuat data… Jika terlalu lama, periksa koneksi internet.</div>`:{home,members,add,loans,kas,rekap}[S.tab]();
 $('#st').textContent=!S.db?'memuat…':S.admin?'🔓 Admin':S.coll?'✏️ Penarik Iuran':S.user?'⚠️ Belum terdaftar':'🔒 Mode baca';const b=$('#lg');if(b)b.textContent=S.user?'🚪':'🔑';b.title=S.user?'Keluar':'Masuk Admin'}

(async()=>{R();

 if(!api){toast('Tidak dapat terhubung ke Firebase.');return}
 S.db=api;
 api.onAuth(u=>{S.user=u;const m=norm(u&&u.email);S.admin=ADMINS.includes(m);S.owner=S.admin;S.coll=S.admin||COLLECTORS.includes(m);S.uid=u?u.uid:'';if(u&&!S.coll)toast('Email '+u.email+' belum terdaftar sebagai pengurus.');R()});

 sub('transactions','tx');sub('members','mem');sub('loans','loan');sub('iuran','iur');R()})();

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";
import {getFirestore,collection,doc,addDoc,setDoc,updateDoc,deleteDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyDKdHZuDvacrMT_Y3YZLMRArggCjay1VD8",authDomain:"ikpm-catatan-keuangan.firebaseapp.com",projectId:"ikpm-catatan-keuangan",storageBucket:"ikpm-catatan-keuangan.firebasestorage.app",messagingSenderId:"449843262104",appId:"1:449843262104:web:9f751f532a98e50bb596ed"});
const db=getFirestore(app),auth=getAuth(app);
const ref=(n,id)=>id?doc(db,n,id):doc(collection(db,n));
window.fbResolve({
 collection:n=>({doc:id=>{const r=ref(n,id);return{id:r.id,set:d=>setDoc(r,d),update:d=>updateDoc(r,d),delete:()=>deleteDoc(r)}},
  add:d=>addDoc(collection(db,n),d),
  onSnapshot:(f,e)=>onSnapshot(collection(db,n),q=>f({docs:q.docs.map(x=>({id:x.id,data:()=>x.data()}))}),e)}),
 onAuth:f=>onAuthStateChanged(auth,f),login:(e,p)=>signInWithEmailAndPassword(auth,e,p),logout:()=>signOut(auth)});
</script>
