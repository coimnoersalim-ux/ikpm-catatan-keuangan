<style>
:root{--bg:#f4f5fb;--card:#fff;--tx:#1f2437;--mu:#717790;--bd:#eceef6;--pri:#e8407c;--pri2:#fde3ee;--in:#16a34a;--out:#e11d48;--hd:#b4509f;--hd2:#ea4380;--shadow:0 10px 30px rgba(99,102,241,.09);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
:root[data-theme="dark"]{--bg:#12141f;--card:#1c2030;--tx:#eef0f8;--mu:#9aa1ba;--bd:#2c3248;--pri:#f472b6;--pri2:#4a1d38;--in:#4ade80;--out:#fb7185;--hd:#5b2a5c;--hd2:#8f2f5a;--shadow:0 10px 30px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:110px}
header{background:linear-gradient(120deg,var(--hd),var(--hd2));color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;box-shadow:0 6px 18px rgba(180,80,150,.3)}
.logo{height:46px;width:auto;object-fit:contain;flex:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
header h1{font-size:17px;margin:0;font-weight:800;letter-spacing:-.5px}header small{opacity:.85;font-size:12px;font-weight:600;color:#ffe4f0}header .sp{flex:1}
header button{padding:6px 10px;font-size:16px;background:rgba(255,255,255,.2);color:#fff}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);box-shadow:var(--shadow);border-radius:18px;padding:18px;margin-bottom:16px}
.hero{background:linear-gradient(135deg,#7c4dff,#e8407c);color:#fff;border:0;box-shadow:0 12px 26px rgba(124,77,255,.25)}
.hero h2{font-size:34px;margin:4px 0 14px;letter-spacing:-.5px;overflow-wrap:anywhere}.hero .r{display:flex;gap:18px;border-top:1px solid #ffffff44;padding-top:12px}.hero .r div{flex:1}.hero b{font-size:17px;display:block}
.grid{display:grid;gap:14px;grid-template-columns:1fr}@media(min-width:720px){.grid.c2{grid-template-columns:1fr 1fr}}
h3{margin:0 0 10px;font-size:16px;letter-spacing:-.3px}.mu{color:var(--mu);font-size:12px}
.row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px dashed var(--bd)}.row:last-child{border:0}.row .g{flex:1;min-width:0}.row .g b{display:block;overflow-wrap:anywhere}.row .g span{display:block}
.in{color:var(--in)}.out{color:var(--out)}.amt{font-weight:800;white-space:nowrap;font-size:15px}
button,select,input{font:inherit;color:var(--tx)}
input,select{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:12px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--pri);border-color:transparent}
button{border:0;border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--pri);color:#fff;transition:.15s}
button:active{transform:scale(.96)}button:disabled{opacity:.5}
button.s{background:var(--pri2);color:var(--pri)}button.d{background:var(--bg);color:var(--out);padding:8px 10px;border:1px solid var(--bd)}
.chip{font-size:11px;font-weight:800;padding:4px 10px;border-radius:99px;letter-spacing:.5px;display:inline-block}.ok{background:#10b98122;color:var(--in)}.no{background:#ef444422;color:var(--out)}
.bar{display:flex;gap:6px;align-items:flex-end;height:120px;margin-top:6px}.bar div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px;font-size:10px;color:var(--mu)}.bar i{display:block;width:100%;border-radius:6px 6px 0 0;min-height:2px}
.table-container{overflow-x:auto;margin:0 -18px;border-top:1px solid var(--bd)}
.kas-table{width:100%;border-collapse:collapse;font-size:13px}
.kas-table th{background:var(--bg);color:var(--mu);text-align:left;padding:12px 14px;font-weight:600;border-bottom:1px solid var(--bd);white-space:nowrap}
.kas-table td{padding:12px 14px;border-bottom:1px dashed var(--bd);vertical-align:middle}
.kas-table tr:last-child td{border-bottom:0}.kas-table .r{text-align:right;white-space:nowrap}
.kas-table tbody tr:hover{background:var(--bg)}
nav{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:12px;right:12px;max-width:520px;margin:0 auto;background:var(--card);border:1px solid var(--bd);border-radius:24px;display:flex;justify-content:space-around;padding:6px;z-index:6;box-shadow:var(--shadow)}
nav button{background:transparent;color:var(--mu);font-size:10.5px;display:flex;flex-direction:column;gap:2px;align-items:center;padding:7px 8px;border-radius:16px;font-weight:600;flex:1}
nav button.a{background:var(--pri2);color:var(--pri)}nav span{font-size:20px}

  <div><h1>Keuangan IKPM</h1><small>Ikatan Pemuda Mekarjaya</small></div>
  <div id="qa" class="qa"></div>
  <div class="sp"></div>
  <small id="st">memuat…</small>
  <button onclick="toggleTheme()" title="Ubah tema" aria-label="Ubah tema">🌓</button>
  <button id="lg" onclick="authBtn()" title="Masuk Admin" aria-label="Masuk Admin">🔑</button>
</header>

<main id="v"></main>

<nav id="nav"></nav>
<script src="config.js"></script>
<script>
function toggleTheme(){var t=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';document.documentElement.setAttribute('data-theme',t);localStorage.setItem('theme',t)}
const $=s=>document.querySelector(s),rp=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n||0);
const esc=s=>String(s!=null?s:'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let IURAN=25000;const BUNGA=.3,BULAN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'],RTS=['RT Mekarjaya','RT Cipancur'];
const S={tab:'home',year:String(new Date().getFullYear()),tx:[],mem:[],loan:[],iur:[],coll:false,admin:false,uid:'',db:null,user:null,q:'',rt:'semua',filt:'semua',loanTab:'aktif',ld:{}};
const today=()=>new Date().toISOString().slice(0,10),CY=()=>new Date().getFullYear();
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3200)}
const yearOf=t=>(t.date||'').slice(0,4);
const allTx=()=>S.tx.filter(t=>!t.id.startsWith('iuran_')).concat(S.iur.map(i=>({id:'i_'+i.id,virtual:1,type:'income',amount:i.amount||IURAN,category:i.kind==='donasi'?'Donasi':'Iuran Anggota Tetap',description:i.kind==='donasi'?`Donasi - ${i.name}`:`Iuran ${i.year} - ${i.name}`,date:i.date||'',createdAt:i.date||''})));
const years=()=>{const a=new Set(Array.from({length:Math.max(9,CY()-2022+3)},(_,i)=>String(2022+i)));allTx().forEach(t=>{const y=yearOf(t);if(y)a.add(y)});return[...a].sort().reverse()};
const sync=()=>{S.mem.forEach(m=>{m.iuran={};m.don=[]});S.iur.forEach(i=>{const m=S.mem.find(x=>x.id===i.memberId);if(!m)return;if(i.kind==='donasi')m.don.push(i);else m.iuran[i.year]=i})};
const ftx=()=>allTx().filter(t=>S.year==='all'||yearOf(t)===S.year).sort((a,b)=>(b.date+b.createdAt).localeCompare(a.date+a.createdAt));
const sg=x=>x.type==='income'?x.amount:-x.amount;
async function w(fn,ok,lvl){const allowed=lvl==='coll'?S.coll:S.admin;if(!S.db||!allowed)return toast(lvl==='coll'?'Anda tidak punya izin mencatat.':'Hanya Admin yang dapat mengubah data.');try{await fn();ok&&toast(ok)}catch(e){toast('Gagal menyimpan: '+(e.message||e.code))}}
const col=n=>S.db.collection(n);
const addTx=o=>col('transactions').add(Object.assign({},o,{createdAt:new Date().toISOString()}));
const yearSel=()=>`<select onchange="S.year=this.value;R()" aria-label="Pilih tahun"><option value="all"${S.year==='all'?' selected':''}>Semua Tahun</option>${years().map(y=>`<option${y===S.year?' selected':''}>${y}</option>`).join('')}</select>`;
const searchBox=ph=>`<input placeholder="${ph}" value="${esc(S.q)}" oninput="S.q=this.value;clearTimeout(S._d);S._d=setTimeout(()=>{R();const e=$('#q');e&&(e.focus(),e.setSelectionRange(99,99))},250)" id="q">`;

/* ---- tunggakan ---- */
const since=m=>+(m.since||2022);
const tagihan=(m,y)=>(m.tagihan&&m.tagihan[y]!==undefined)?Number(m.tagihan[y]):IURAN;
const arrears=m=>{if(m.role!=='Anggota Tetap')return[];const r=[];for(let y=since(m);y<CY();y++)if(!(m.iuran&&m.iuran[y]))r.push(String(y));return r};
const arrearSum=m=>arrears(m).reduce((a,y)=>a+tagihan(m,y),0);
const getIuranAmt=(m,y)=>(m.iuran&&m.iuran[y]&&m.iuran[y].amount)?m.iuran[y].amount:tagihan(m,y);
const piutang=l=>l.total-(l.paidAmount||0);

/* ---- beranda ---- */
const short=n=>n>=1e6?(Math.round(n/1e5)/10).toString().replace('.',',')+' jt':n>=1e3?Math.round(n/1e3)+' rb':String(Math.round(n));
function chart(data,labels){const mx=Math.max(1,...data.flat());
 return `<div class="chart"><div class="yax">${[4,3,2,1,0].map(k=>`<span>${short(mx*k/4)}</span>`).join('')}</div><div class="plot">${data.map((d,k)=>`<div class="col" title="${labels[k]}"><span class="bars"><i style="background:var(--in);height:${d[0]/mx*100}%"></i><i style="background:var(--out);height:${d[1]/mx*100}%"></i></span><em>${labels[k]}</em></div>`).join('')}</div></div><div class="mu" style="margin-top:6px"><span class="in">■</span> Pemasukan &nbsp;<span class="out">■</span> Pengeluaran</div>`}
const PAL=['#f0c040','#7fb7ee','#3b7dc4','#36b574','#ee6b6b','#a78bfa','#f59e0b'];
function pie(items){const tot=items.reduce((a,i)=>a+i.v,0);if(!tot)return '<div class="empty">Belum ada pemasukan.</div>';
 let a0=-Math.PI/2;const R0=90,c=100;
 const paths=items.map((it,k)=>{const f=it.v/tot,a1=a0+f*2*Math.PI,x0=c+R0*Math.cos(a0),y0=c+R0*Math.sin(a0),x1=c+R0*Math.cos(a1),y1=c+R0*Math.sin(a1);
  const d=f>=.9999?`M${c} ${c-R0}A${R0} ${R0} 0 1 1 ${c-.01} ${c-R0}Z`:`M${c} ${c}L${x0} ${y0}A${R0} ${R0} 0 ${f>.5?1:0} 1 ${x1} ${y1}Z`;a0=a1;
  return `<path d="${d}" fill="${PAL[k%PAL.length]}" stroke="#fff" stroke-width="1"><title>${esc(it.n)}: ${rp(it.v)}</title></path>`}).join('');
 return `<div class="pie"><svg viewBox="0 0 200 200" role="img" aria-label="Komposisi pemasukan">${paths}</svg><div class="leg">${items.map((it,k)=>`<div><i style="background:${PAL[k%PAL.length]}"></i><span>${esc(it.n)}</span><b>${rp(it.v)}</b><em>${Math.round(it.v/tot*100)}%</em></div>`).join('')}</div></div><div class="ctr">Total Pemasukan : ${rp(tot)}</div>`}
const jt=n=>{const a=Math.abs(n),s=n<0?'−':'';return s+(a>=1e9?'Rp. '+(a/1e9).toFixed(1).replace('.',',')+'M':a>=1e6?'Rp. '+(a/1e6).toFixed(1).replace('.',',')+'JT':rp(a))};
const tile=(c,ic,v,lbl,to)=>`<div class="tile ${c}" title="${rp(v)}"><span class="wm">${ic}</span><div class="tv">${jt(v)}</div><div class="tl">${lbl}</div><div class="tf" onclick="go('${to}')"><span>LIHAT SELENGKAPNYA</span><span>➜</span></div></div>`;
const pnl=(t,b)=>`<div class="pnl"><div class="pnl-h">${t}</div><div class="pnl-b">${b}</div></div>`;
function home(){const all=allTx(),td=today(),cy=String(CY()),ym=td.slice(0,7),Y=S.year,yy=Y==='all'?cy:Y,inY=x=>Y==='all'||yearOf(x)===Y;
 const sm=(ty,f)=>all.filter(x=>x.type===ty&&f(x)).reduce((a,x)=>a+x.amount,0);
 const tin=sm('income',inY),tout=sm('expense',inY),kasAkhir=all.filter(x=>Y==='all'||yearOf(x)<=Y).reduce((a,x)=>a+sg(x),0);
 const aktif=S.loan.filter(l=>l.status==='unpaid'),piut=aktif.reduce((a,l)=>a+piutang(l),0);
 const cat={};all.filter(x=>x.type==='income'&&inY(x)).forEach(x=>cat[x.category]=(cat[x.category]||0)+x.amount);
 const items=Object.entries(cat).map(([n,v])=>({n,v})).sort((a,b)=>b.v-a.v);
 const mdata=BULAN.map((_,m)=>{const k=yy+'-'+String(m+1).padStart(2,'0'),f=all.filter(x=>(x.date||'').slice(0,7)===k);return[f.filter(x=>x.type==='income').reduce((a,x)=>a+x.amount,0),f.filter(x=>x.type==='expense').reduce((a,x)=>a+x.amount,0)]});
 const ys=[...new Set(all.map(yearOf).concat(cy).filter(Boolean))].sort(),ydata=ys.map(y=>[sm('income',x=>yearOf(x)===y),sm('expense',x=>yearOf(x)===y)]);

 const i=Math.round(a*BUNGA),id=col('loans').doc().id;

  await col('transactions').doc('out_'+id).set({type:'expense',amount:a,category:'Pinjaman Anggota',description:'Pinjaman - '+m.name,date:today(),loanId:id,createdAt:new Date().toISOString()});R()},'Pinjaman dicatat.')}

/* ---- rekap & laporan ---- */
function rekapData(){const y=S.year;return RTS.map(rt=>{const m=S.mem.filter(x=>x.rt===rt),t=m.filter(x=>x.role==='Anggota Tetap'),l=t.filter(x=>x.iuran&&x.iuran[y]);
 return{rt,m,total:m.length,tetap:t.length,donatur:m.length-t.length,lunas:l.length,belum:t.filter(x=>!(x.iuran&&x.iuran[y])),kas:l.reduce((a,x)=>a+getIuranAmt(x,y),0),don:m.reduce((a,x)=>a+(x.don||[]).filter(d=>d.year===y).reduce((b,d)=>b+d.amount,0),0),tg:t.filter(x=>arrears(x).length),target:t.reduce((a,x)=>a+tagihan(x,y),0)}})}
function rekap(){if(S.year==='all')return `<div class="top"><h3 style="margin:0">Rekap per RT</h3>${yearSel()}</div><div class="card empty">Pilih satu tahun untuk melihat rekap iuran per RT.</div>`;
 const D=rekapData(),g=D.reduce((a,d)=>a+d.kas,0),tg=D.reduce((a,d)=>a+d.target,0);
 return `<div class="top"><h3 style="margin:0">Rekap Iuran ${S.year}</h3>${yearSel()}</div>
 <div class="card hero"><div class="mu" style="color:#d1fae5">Terkumpul dari target</div><h2>${rp(g)} <span style="font-size:15px;opacity:.8">/ ${rp(tg)}</span></h2></div>
 <div class="card adm" style="display:flex;gap:8px;flex-wrap:wrap"><button class="s" onclick="csvRekap()">⬇ Semua RT</button>${RTS.map(r=>`<button class="s" onclick="csvRekap('${r}')">⬇ ${r}</button>`).join('')}<button class="s" onclick="laporan()">🖨 Laporan (PDF)</button></div>
 <div class="grid c2">${D.map(d=>`<div class="card"><h3>${d.rt}</h3><div class="mu">${d.total} anggota • ${d.tetap} tetap • ${d.donatur} donatur</div>
 <div class="row"><div class="g">Lunas</div><b class="in">${d.lunas} / ${d.tetap}</b></div><div class="row"><div class="g">Terkumpul</div><b>${rp(d.kas)}</b></div><div class="row"><div class="g">Donasi</div><b>${rp(d.don)}</b></div><div class="row"><div class="g">Belum lunas</div><b class="out">${d.belum.length} orang</b></div><div class="row"><div class="g">Menunggak tahun lalu</div><b class="out">${d.tg.length} orang • ${rp(d.tg.reduce((a,x)=>a+arrearSum(x),0))}</b></div>
 ${d.belum.length?`<div class="mu" style="margin-top:8px">${d.belum.map(x=>esc(x.name)).join(', ')}</div>`:''}</div>`).join('')}</div>`}
async function csvRekap(rt){if(!S.admin)return;const rows=[['RT','Nama','Peran','Iuran '+S.year,'Nominal'],...rekapData().filter(x=>!rt||x.rt===rt).flatMap(x=>x.m.map(m=>{const tt=m.role==='Anggota Tetap',p=m.iuran&&m.iuran[S.year];return[x.rt,m.name,m.role,tt?(p?'Lunas':'Belum'):'-',tt&&p?getIuranAmt(m,S.year):0]}))];
 await DL.save({filename:`rekap-iuran-${rt?rt.replace(' ','-'):'semua-rt'}-${S.year}.csv`,data:toCsv(rows)})}
function laporan(){if(!S.admin)return;const Y=S.year,per=Y==='all'?'Semua Tahun':'Tahun '+Y;
 const awal=Y==='all'?0:allTx().filter(x=>yearOf(x)<Y).reduce((a,x)=>a+sg(x),0),t=ftx().slice().sort((a,b)=>(a.date+a.createdAt).localeCompare(b.date+b.createdAt));
 const mi=t.filter(x=>x.type==='income').reduce((a,x)=>a+x.amount,0),mo=t.filter(x=>x.type==='expense').reduce((a,x)=>a+x.amount,0),piut=S.loan.reduce((a,l)=>a+(l.status==='unpaid'?piutang(l):0),0);
 let s=awal;const rows=t.map(x=>{const i=x.type==='income';s+=sg(x);return `<tr><td>${esc(x.date)}</td><td>${esc(x.description)}</td><td>${esc(x.category)}</td><td class="r">${i?rp(x.amount):''}</td><td class="r">${i?'':rp(x.amount)}</td><td class="r">${rp(s)}</td></tr>`}).join('');
 const tgs=S.mem.filter(m=>arrears(m).length),logo=document.querySelector('header img.logo');
 const rk=Y==='all'?'':`<h4>Rekap Iuran per RT</h4><table><tr><th>RT</th><th>Anggota Tetap</th><th>Lunas</th><th>Belum</th><th>Iuran Terkumpul</th><th>Donasi</th></tr>${rekapData().map(d=>`<tr><td>${d.rt}</td><td class="r">${d.tetap}</td><td class="r">${d.lunas}</td><td class="r">${d.belum.length}</td><td class="r">${rp(d.kas)}</td><td class="r">${rp(d.don)}</td></tr>`).join('')}</table>`;
 const tg=`<h4>Daftar Tunggakan Iuran (Tahun Sebelumnya)</h4>${tgs.length?`<table><tr><th>No</th><th>Nama</th><th>RT</th><th>Tahun</th><th>Jumlah</th></tr>${tgs.map((m,k)=>`<tr><td>${k+1}</td><td>${esc(m.name)}</td><td>${esc(m.rt)}</td><td>${arrears(m).join(', ')}</td><td class="r">${rp(arrearSum(m))}</td></tr>`).join('')}<tr><th colspan="4">Total</th><th class="r">${rp(tgs.reduce((a,m)=>a+arrearSum(m),0))}</th></tr></table>`:'<p>Tidak ada tunggakan.</p>'}`;
 const tgl=new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
 let o=$('#rep');if(o)o.remove();o=document.createElement('div');o.id='rep';
 o.innerHTML=`<div class="tb"><button onclick="print()">🖨 Cetak / Simpan PDF</button><button class="s" onclick="$('#rep').remove()">✕ Tutup</button></div><div class="pg">
 <div class="kop">${logo&&logo.style.display!=='none'?`<img src="${logo.src}">`:''}<div><b>IKATAN PEMUDA MEKARJAYA (IKPM)</b><br>LAPORAN KEUANGAN — ${per.toUpperCase()}<br><small>Dicetak ${tgl}</small></div></div>
 <table class="sum"><tr><td>Saldo awal</td><td class="r">${rp(awal)}</td></tr><tr><td>Total pemasukan</td><td class="r">${rp(mi)}</td></tr><tr><td>Total pengeluaran</td><td class="r">${rp(mo)}</td></tr><tr><th>Saldo akhir</th><th class="r">${rp(awal+mi-mo)}</th></tr><tr><td><i>Piutang pinjaman (belum lunas)</i></td><td class="r"><i>${rp(piut)}</i></td></tr></table>
 ${rk}${tg}<h4>Buku Kas Umum</h4><table><tr><th>Tanggal</th><th>Uraian</th><th>Kategori</th><th>Masuk</th><th>Keluar</th><th>Saldo</th></tr><tr><td colspan="5"><i>Saldo awal</i></td><td class="r">${rp(awal)}</td></tr>${rows||'<tr><td colspan="6">Belum ada transaksi.</td></tr>'}</table>
 <div class="ttd"><div>Mengetahui,<br>Ketua IKPM<br><br><br><br>( ........................ )</div><div>Mekarjaya, ${tgl}<br>Bendahara<br><br><br><br>( ........................ )</div></div></div>`;
 document.body.appendChild(o)}

/* ---- navigasi & render ---- */
const TABS=[['home','🏠','Beranda'],['members','👥','Anggota'],['add','➕','Catat'],['loans','🤝','Pinjaman'],['kas','📒','Buku Kas'],['rekap','📊','Rekap']];
const TITLES={home:'Dashboard',members:'Anggota',add:'Catat Transaksi',loans:'Pinjaman Kas',kas:'Buku Kas Umum',rekap:'Rekap Iuran'};
const qaHtml=()=>!S.coll?'':`<button onclick="CATAT_TAB='iuran';go('add')">＋ Iuran</button>`+(S.admin?`<button onclick="CATAT_TAB='income';go('add')">＋ Pemasukan</button><button onclick="CATAT_TAB='expense';go('add')">＋ Pengeluaran</button><button onclick="go('loans')">＋ Pinjaman</button>`:'');
const loaded=()=>['tx','mem','loan','iur'].every(k=>S.ld[k]);
function R(){if(S.tab==='add'&&!S.coll)S.tab='home';document.body.classList.toggle('isadmin',!!S.admin);
 const nb=TABS.filter(t=>t[0]!=='add'||S.coll).map(([k,i,l])=>`<button class="${S.tab===k?'a':''}" onclick="go('${k}')"><span>${i}</span>${l}</button>`).join('');$('#nav').innerHTML=nb;$('#side').innerHTML=nb;$('#qa').innerHTML=qaHtml();
 $('#v').innerHTML=!S.db||!loaded()?`<div class="card empty">Memuat data… Jika terlalu lama, periksa koneksi internet.</div>`:(S.tab==='home'?'':`<div class="bc"><b>Home</b> / ${TITLES[S.tab]}</div>`)+{home,members,add,loans,kas,rekap}[S.tab]();
 $('#st').textContent=!S.db?'memuat…':S.admin?'🔓 Admin':S.coll?'✏️ Penarik Iuran':S.user?'⚠️ Belum terdaftar':'🔒 Mode baca';
 const b=$('#lg');b.textContent=S.user?'🚪':'🔑';b.title=b.ariaLabel=S.user?'Keluar':'Masuk Admin'}
function go(t){if(t==='add'&&!S.coll)return toast('Hanya pengurus yang dapat mencatat.');S.tab=t;S.q='';R();scrollTo(0,0)}
window.fbReadyP=new Promise(r=>window.fbResolve=r);
const CFG=window.IKPM_CONFIG||{},norm=e=>(e||'').trim().toLowerCase(),ADMINS=(CFG.ADMINS||[]).map(norm),COLLECTORS=(CFG.COLLECTORS||[]).map(norm);
const DL={save:async({filename,data})=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+data],{type:'text/csv;charset=utf-8'}));a.download=filename;document.body.appendChild(a);a.click();a.remove()}};
function authBtn(){if(S.user){S.db.logout();toast('Anda sudah keluar.');return}
 const o=document.createElement('div');o.id='lgm';o.className='ovl';
 o.innerHTML=`<form class="card" style="width:100%;max-width:340px;margin:0" onsubmit="return doLogin(event)"><h3>Masuk Pengurus</h3><div class="f"><input id="le" type="email" placeholder="Email" autocomplete="username" required><input id="lp2" type="password" placeholder="Kata sandi" autocomplete="current-password" required><button>Masuk</button><button type="button" class="s" onclick="this.closest('#lgm').remove()">Batal</button></div></form>`;document.body.appendChild(o);$('#le').focus()}
async function doLogin(e){e.preventDefault();try{await S.db.login($('#le').value.trim(),$('#lp2').value);$('#lgm').remove();toast('Berhasil masuk.')}catch(x){toast('Email atau kata sandi salah.')}return false}
(async()=>{R();
 const api=await Promise.race([window.fbReadyP,new Promise(r=>setTimeout(()=>r(null),12000))]);
 if(!api){toast('Tidak dapat terhubung ke Firebase.');return}
 S.db=api;
 api.onAuth(u=>{S.user=u;const m=norm(u&&u.email);S.admin=ADMINS.includes(m);S.coll=S.admin||COLLECTORS.includes(m);S.uid=u?u.uid:'';if(u&&!S.coll)toast('Email '+u.email+' belum terdaftar sebagai pengurus.');R()});
 const sub=(n,k)=>col(n).onSnapshot(s=>{S[k]=s.docs.map(d=>Object.assign({id:d.id},d.data()));S.ld[k]=1;sync();R()},()=>{S.ld[k]=1;toast('Gagal memuat data '+n+' (cek aturan Firestore).');R()});
 sub('transactions','tx');sub('members','mem');sub('loans','loan');sub('iuran','iur');
 col('settings').onSnapshot(s=>{const d=s.docs.find(x=>x.id==='app');if(d)IURAN=Number(d.data().iuran)||25000;R()},()=>{});
})();
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";
import {getFirestore,collection,doc,addDoc,setDoc,updateDoc,deleteDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyDKdHZuDvacrMT_Y3YZLMRArggCjay1VD8",authDomain:"ikpm-catatan-keuangan.firebaseapp.com",projectId:"ikpm-catatan-keuangan",storageBucket:"ikpm-catatan-keuangan.firebasestorage.app",messagingSenderId:"449843262104",appId:"1:449843262104:web:9f751f532a98e50bb596ed"});
const db=getFirestore(app),auth=getAuth(app);
const ref=(n,id)=>id?doc(db,n,id):doc(collection(db,n));
window.fbResolve({
 collection:n=>({doc:id=>{const r=ref(n,id);return{id:r.id,set:d=>setDoc(r,d),update:d=>updateDoc(r,d),delete:()=>deleteDoc(r)}},
  add:d=>addDoc(collection(db,n),d),
  onSnapshot:(f,e)=>onSnapshot(collection(db,n),q=>f({docs:q.docs.map(x=>({id:x.id,data:()=>x.data()}))}),e||(()=>{}))}),
 onAuth:f=>onAuthStateChanged(auth,f),login:(e,p)=>signInWithEmailAndPassword(auth,e,p),logout:()=>signOut(auth)});
</script>
