<script>
const $=s=>document.querySelector(s),rp=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n||0);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let IURAN=25000; const BUNGA=.3,BULAN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const S={tab:'home',year:String(new Date().getFullYear()),tx:[],mem:[],loan:[],iur:[],coll:false,uid:'',admin:false,db:null,q:'',rt:'semua',filt:'semua',ready:false,loanTab:'aktif'};
const today=()=>new Date().toISOString().slice(0,10);
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2800)}
const yearOf=t=>(t.date||'').slice(0,4);
const years=()=>{const a=new Set(Array.from({length:9},(_,i)=>String(2022+i)));allTx().forEach(t=>a.add(yearOf(t)));return[...a].filter(Boolean).sort().reverse()};
const allTx=()=>S.tx.filter(t=>!t.id.startsWith('iuran_')).concat(S.iur.map(i=>({id:'i_'+i.id,virtual:1,type:'income',amount:i.amount||IURAN,category:i.kind==='donasi'?'Donasi':'Iuran Anggota Tetap',description:i.kind==='donasi'?`Donasi - ${i.name}`:`Iuran ${i.year} - ${i.name}`,date:i.date,createdAt:i.date})));
const sync=()=>{S.mem.forEach(m=>{m.iuran={};m.don=[]});S.iur.forEach(i=>{const m=S.mem.find(x=>x.id===i.memberId);if(!m)return;if(i.kind==='donasi')m.don.push(i);else m.iuran[i.year]=i})};
const ftx=()=>allTx().filter(t=>S.year==='all'||yearOf(t)===S.year).sort((a,b)=>(b.date+b.createdAt).localeCompare(a.date+a.createdAt));
async function w(fn,ok){if(!S.db||!S.admin)return toast('Hanya Admin yang dapat mengubah data.');try{await fn();ok&&toast(ok)}catch(e){toast('Gagal menyimpan: '+(e.message||e.code))}}
const col=n=>S.db.collection(n);
const addTx=(o)=>col('transactions').add({...o,createdAt:new Date().toISOString()});
function yearSel(){return `<select onchange="S.year=this.value;R()"><option value="all"${S.year==='all'?' selected':''}>Semua Tahun</option>${years().map(y=>`<option${y===S.year?' selected':''}>${y}</option>`).join('')}</select>`}
function home(){const t=ftx(),i=t.filter(x=>x.type==='income').reduce((a,x)=>a+x.amount,0),o=t.filter(x=>x.type==='expense').reduce((a,x)=>a+x.amount,0);
 const mo=BULAN.map((_,m)=>{const k=m+1;const f=t.filter(x=>+x.date.slice(5,7)===k);return[f.filter(x=>x.type==='income').reduce((a,x)=>a+x.amount,0),f.filter(x=>x.type==='expense').reduce((a,x)=>a+x.amount,0)]});
 const mx=Math.max(1,...mo.flat());
 const aktif=S.loan.filter(l=>l.status==='unpaid'),piut=aktif.reduce((a,l)=>a+l.total,0);
 const tetap=S.mem.filter(m=>m.role==='Anggota Tetap'),lun=S.year==='all'?0:tetap.filter(m=>m.iuran && m.iuran[S.year]).length;
 return `<div class="top"><h3 style="margin:0">Ringkasan</h3>${yearSel()}</div>
 <div class="card hero"><div class="mu" style="color:#cfe0ff">Saldo Kas (${S.year==='all'?'Semua Tahun':S.year})</div><h2>${rp(i-o)}</h2><div class="r"><div><span class="mu" style="color:#cfe0ff">Pemasukan</span><b>${rp(i)}</b></div><div><span class="mu" style="color:#cfe0ff">Pengeluaran</span><b>${rp(o)}</b></div></div></div>
 <div class="grid c2"><div class="card"><h3>Piutang Pinjaman</h3><b style="font-size:20px">${rp(piut)}</b><div class="mu">${aktif.length} pinjaman belum lunas</div></div>
 <div class="card"><h3>Iuran Anggota Tetap</h3><b style="font-size:20px">${S.year==='all'?'—':lun+' / '+tetap.length}</b><div class="mu">${S.year==='all'?'Pilih satu tahun untuk melihat':'sudah lunas tahun '+S.year}</div></div></div>
 ${S.year==='all'?'':`<div class="card"><h3>Arus Kas per Bulan</h3><div class="bar">${mo.map((m,k)=>`<div title="${BULAN[k]}"><span style="display:flex;gap:2px;align-items:flex-end;height:96px;width:100%"><i style="background:var(--in);height:${m[0]/mx*100}%"></i><i style="background:var(--out);height:${m[1]/mx*100}%"></i></span>${BULAN[k]}</div>`).join('')}</div><div class="mu"><span class="in">■</span> Masuk &nbsp;<span class="out">■</span> Keluar</div></div>`}
 <div class="card"><h3>Mutasi Terbaru</h3>${t.slice(0,5).map(txRow).join('')||'<div class="mu">Belum ada transaksi.</div>'}</div>`}
function txRow(x,del){return `<div class="row"><div class="g"><b>${esc(x.description)}</b><span class="mu">${esc(x.date)} • ${esc(x.category)}</span></div><span class="amt ${x.type==='income'?'in':'out'}">${x.type==='income'?'+':'−'}${rp(x.amount)}</span>${del&&S.admin&&!x.virtual?`<button class="d" onclick="delTx('${x.id}')">🗑</button>`:''}</div>`}
function kas(){const t=ftx().filter(x=>!S.q||(x.description+x.category).toLowerCase().includes(S.q.toLowerCase()));
 return `<div class="top"><h3 style="margin:0">Buku Kas Umum</h3>${yearSel()}</div><div class="card np"><input placeholder="Cari transaksi…" value="${esc(S.q)}" oninput="S.q=this.value;clearTimeout(S._d);S._d=setTimeout(()=>{R();const e=$('.card input');e&&(e.focus(),e.setSelectionRange(99,99))},250)"><div class="adm" style="display:flex;gap:8px;margin-top:10px"><button class="s" onclick="csv()">⬇ Ekspor CSV</button><button class="s" onclick="laporan()">🖨 Laporan (PDF)</button></div></div>
 <div class="card">${t.map(x=>txRow(x,1)).join('')||'<div class="mu">Tidak ada data.</div>'}</div>`}
function delTx(id){if(confirm('Hapus transaksi ini?'))w(()=>col('transactions').doc(id).delete(),'Transaksi dihapus.')}
async function csv(){if(!S.admin)return;const d=DL;const rows=[['Tanggal','Jenis','Kategori','Keterangan','Nominal'],...ftx().map(x=>[x.date,x.type==='income'?'Masuk':'Keluar',x.category,x.description,x.amount])];
 const data=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
 if(!d)return toast('Unduh tidak tersedia di tampilan ini.');try{await d.save({filename:`kas-ikpm-${S.year}.csv`,data})}catch(e){}}
function add(){if(!S.admin)return `<div class="card">Fitur ini khusus Admin.</div>`;
 return `<div class="card" style="max-width:520px;margin:auto"><h3>Catat Transaksi</h3><div class="f"><div class="tabs"><button id="ti" class="a" onclick="ty('income')">Pemasukan</button><button id="te" onclick="ty('expense')">Pengeluaran</button></div>
 <input id="am" type="number" inputmode="numeric" min="1" placeholder="Nominal (Rp)"><select id="ct"><option>Iuran Wajib</option><option>Donasi</option><option>Kasaran / Operasional</option><option>Lainnya</option></select><input id="ds" placeholder="Keterangan"><input id="dt" type="date" value="${today()}"><button onclick="saveTx()">Simpan</button></div></div>`}
let TYPE='income';function ty(t){TYPE=t;$('#ti').className=t==='income'?'a':'';$('#te').className=t==='expense'?'a':''}
function saveTx(){const a=+$('#am').value,d=$('#ds').value.trim(),dt=$('#dt').value;if(!(a>0)||!d||!dt)return toast('Lengkapi nominal, keterangan, dan tanggal.');
 w(async()=>{await addTx({type:TYPE,amount:a,category:$('#ct').value,description:d,date:dt});S.tab='home';TYPE='income';R()},'Transaksi dicatat.')}
 
// SISTEM TUNGGAKAN DINAMIS (Anti-blank & Aman di browser lawas)
const since=m=>+(m.since||2022);
const arrears=m=>{if(m.role!=='Anggota Tetap')return[];const r=[];for(let y=since(m);y<new Date().getFullYear();y++)if(!(m.iuran && m.iuran[y]))r.push(String(y));return r};
const tagihan=(m,y)=>(m.tagihan && m.tagihan[y] !== undefined) ? Number(m.tagihan[y]) : IURAN;
const arrearSum=m=>arrears(m).reduce((a,y)=>a+tagihan(m,y),0);

function members(){const y=S.year,per=y!=='all',cy=new Date().getFullYear();
 const ok=m=>(S.rt==='semua'||m.rt===S.rt)&&(!S.q||m.name.toLowerCase().includes(S.q.toLowerCase()))&&(S.filt==='semua'||(S.filt==='tunggak'?arrears(m).length>0:!per||(m.role==='Anggota Tetap'&&(S.filt==='lunas')===!!(m.iuran && m.iuran[y]))));
 const f=S.mem.filter(ok).sort((a,b)=>a.name.localeCompare(b.name));
 const tg=S.mem.filter(m=>arrears(m).length),tgSum=tg.reduce((a,m)=>a+arrearSum(m),0);
 const card=m=>{const ar=arrears(m),dn=(m.don||[]).filter(d=>d.year===y).reduce((a,d)=>a+d.amount,0),lunas=(m.iuran && m.iuran[y]);
  return `<div class="row"><div class="g"><b>${esc(m.name)}</b><span class="mu">${esc(m.rt)} • ${esc(m.role)}${m.role==='Anggota Tetap'?' • sejak '+since(m):''}</span>${ar.length?`<span class="out" style="font-size:12px;font-weight:700">Tunggakan ${ar.length} thn (${ar.join(', ')}) • ${rp(arrearSum(m))}</span>`:''}${m.role!=='Anggota Tetap'&&per&&dn?`<span class="in" style="font-size:12px">Donasi ${y}: ${rp(dn)}</span>`:''}</div>${per&&m.role==='Anggota Tetap'?`<button class="chip ${lunas?'ok':'no'}" ${S.coll?'':'disabled'} onclick="iuran('${m.id}')">${lunas?'LUNAS':'BELUM'}</button>`:''}${S.admin?`<button class="d" onclick="editMem('${m.id}')">✏️</button><button class="d" onclick="delMem('${m.id}')">🗑</button>`:''}</div>`};
return `<div class="top"><div><h3 style="margin:0">Anggota (${S.mem.length})</h3><span class="mu">Tarif Dasar Iuran: ${rp(IURAN)}/tahun • Menunggak: ${tg.length} orang (${rp(tgSum)})</span></div><div style="display:flex;gap:8px;align-items:center;">${S.admin ? `<button class="s" onclick="editTarif()">⚙️ Ubah Tarif Dasar</button>` : ''}${yearSel()}</div></div>
 <div class="card"><div class="f"><input placeholder="Cari nama…" value="${esc(S.q)}" oninput="S.q=this.value;clearTimeout(S._d);S._d=setTimeout(()=>{R();const e=$('.card input');e&&(e.focus(),e.setSelectionRange(99,99))},250)">
 <div class="tabs" style="margin:0">${['semua','RT Mekarjaya','RT Cipancur'].map(r=>`<button class="${S.rt===r?'a':''}" onclick="S.rt='${r}';R()">${r==='semua'?'Semua RT':r}</button>`).join('')}</div>
 <div class="tabs" style="margin:0">${[['semua','Semua'],['lunas','Lunas'],['belum','Belum'],['tunggak','Menunggak']].map(([k,l])=>`<button class="${S.filt===k?'a':''}" onclick="S.filt='${k}';R()">${l}</button>`).join('')}</div></div></div>
${S.admin?`<div class="card"><h3>Tambah Anggota</h3><div class="f"><input id="mn" placeholder="Nama lengkap"><select id="mr"><option>RT Mekarjaya</option><option>RT Cipancur</option></select><select id="mo"><option>Anggota Tetap</option><option>Anggota Donatur</option></select><label class="mu">Mulai iuran tahun</label><select id="ms">${Array.from({length:cy-2021},(_,k)=>`<option${k===(cy-2021)-1?' selected':''}>${2022+k}</option>`).join('')}</select><button onclick="addMem()">Simpan</button></div></div>`:''}
 <div class="card">${f.map(card).join('')||'<div class="mu">Tidak ada anggota.</div>'}</div>`}
function editMem(id){if(!S.admin)return;S.em={id,y:S.year==='all'?String(new Date().getFullYear()):S.year};emView()}
function emView(){const m=S.mem.find(x=>x.id===S.em.id);if(!m)return;const y=S.em.y,cy=new Date().getFullYear(),i=(m.iuran && m.iuran[y]),tetap=m.role==='Anggota Tetap';
 const ys=[];for(let k=Math.min(since(m),+y,cy);k<=Math.max(cy,+y);k++)ys.push(String(k));
 const opt=(a,v)=>a.map(x=>`<option${x==v?' selected':''}>${x}</option>`).join('');
 let o=$('#em');if(!o){o=document.createElement('div');o.id='em';o.style.cssText='position:fixed;inset:0;background:#000a;z-index:30;overflow:auto;padding:16px';document.body.appendChild(o)}
 const dons=(m.don||[]).filter(d=>d.year===y);
 o.innerHTML=`<div class="card" style="max-width:420px;margin:0 auto"><h3>Edit Anggota</h3><div class="f">
 <input id="en" value="${esc(m.name)}" placeholder="Nama"><select id="er">${opt(RTS,m.rt)}</select><select id="eo">${opt(['Anggota Tetap','Anggota Donatur'],m.role)}</select>
 <label class="mu">Mulai iuran tahun</label><select id="es">${opt(Array.from({length:cy-2021},(_,k)=>String(2022+k)),String(since(m)))}</select>
 <button onclick="saveMem()">Simpan Data Anggota</button><hr style="border:0;border-top:1px solid var(--bd);width:100%">
 <label class="mu">Catatan untuk tahun</label><select onchange="S.em.y=this.value;emView()">${opt(ys,y)}</select>
 ${tetap?`<select id="el"><option value="1"${i?' selected':''}>Lunas</option><option value="0"${i?'':' selected'}>Belum</option></select><label class="mu">Tanggal bayar (jika lunas)</label><input id="ed" type="date" value="${i?i.date:today()}"><label class="mu">Nominal Iuran / Tunggakan (Rp)</label><input id="ea" type="number" inputmode="numeric" value="${i?i.amount:tagihan(m,y)}"><button onclick="saveIuran()">Simpan Status ${y}</button>`
 :`${dons.map(d=>`<div class="row"><div class="g">${esc(d.date)}</div><b>${rp(d.amount)}</b><button class="d" onclick="delDon('${d.id}')">🗑</button></div>`).join('')||'<div class="mu">Belum ada donasi tahun '+y+'.</div>'}<label class="mu">Tambah donasi</label><input id="da" type="number" inputmode="numeric" placeholder="Nominal (Rp)"><input id="dd" type="date" value="${today()}"><button onclick="addDon()">Tambah Donasi</button>`}
 <button class="s" onclick="$('#em').remove()">Tutup</button></div></div>`}
function saveMem(){const n=$('#en').value.trim();if(!n)return toast('Nama tidak boleh kosong.');w(async()=>{await col('members').doc(S.em.id).update({name:n,rt:$('#er').value,role:$('#eo').value,since:+$('#es').value});$('#em').remove()},'Data anggota disimpan.')}

function saveIuran(){const m=S.mem.find(x=>x.id===S.em.id),y=S.em.y,r=col('iuran').doc(`${m.id}_${y}`);
 const a=+$('#ea').value,d=$('#ed').value;
 w(async()=>{
  if($('#el').value==='1'){
   if(!(a>0)||!d)throw new Error('Isi nominal dan tanggal.');
   await r.set({memberId:m.id,name:m.name,rt:m.rt,year:y,date:d,amount:a,by:S.uid});
  }else await r.delete();
  await col('members').doc(m.id).update({tagihan:{...(m.tagihan||{}),[y]:a}});
  $('#em').remove()},'Status tahun '+y+' disimpan.')}

function addDon(){const m=S.mem.find(x=>x.id===S.em.id),a=+$('#da').value,d=$('#dd').value;if(!(a>0)||!d)return toast('Isi nominal dan tanggal.');
 w(async()=>{await col('iuran').add({kind:'donasi',memberId:m.id,name:m.name,rt:m.rt,year:d.slice(0,4),date:d,amount:a,by:S.uid});$('#em').remove()},'Donasi dicatat.')}
function delDon(id){if(confirm('Hapus donasi ini?'))w(async()=>{await col('iuran').doc(id).delete();$('#em').remove()},'Donasi dihapus.')}
function laporan(){if(!S.admin)return;const Y=S.year,per=Y==='all'?'Semua Tahun':'Tahun '+Y,all=allTx(),sg=x=>x.type==='income'?x.amount:-x.amount;
 const awal=Y==='all'?0:all.filter(x=>yearOf(x)<Y).reduce((a,x)=>a+sg(x),0);
 const t=ftx().slice().sort((a,b)=>(a.date+a.createdAt).localeCompare(b.date+b.createdAt));
 const mi=t.filter(x=>x.type==='income').reduce((a,x)=>a+x.amount,0),mo=t.filter(x=>x.type==='expense').reduce((a,x)=>a+x.amount,0);
 let s=awal;const rows=t.map(x=>{const i=x.type==='income';s+=sg(x);return `<tr><td>${esc(x.date)}</td><td>${esc(x.description)}</td><td>${esc(x.category)}</td><td class="r">${i?rp(x.amount):''}</td><td class="r">${i?'':rp(x.amount)}</td><td class="r">${rp(s)}</td></tr>`}).join('');
 const tgs=S.mem.filter(m=>arrears(m).length),logo=document.querySelector('header img.logo');
 const rk=Y==='all'?'':`<h4>Rekap Iuran per RT</h4><table><tr><th>RT</th><th>Anggota Tetap</th><th>Lunas</th><th>Belum</th><th>Iuran Terkumpul</th><th>Donasi</th></tr>${rekapData().map(d=>`<tr><td>${d.rt}</td><td class="r">${d.tetap}</td><td class="r">${d.lunas}</td><td class="r">${d.belum.length}</td><td class="r">${rp(d.kas)}</td><td class="r">${rp(d.don)}</td></tr>`).join('')}</table>`;
 const tg=`<h4>Daftar Tunggakan Iuran (Tahun Sebelumnya)</h4>${tgs.length?`<table><tr><th>No</th><th>Nama</th><th>RT</th><th>Tahun</th><th>Jumlah</th></tr>${tgs.map((m,k)=>`<tr><td>${k+1}</td><td>${esc(m.name)}</td><td>${esc(m.rt)}</td><td>${arrears(m).join(', ')}</td><td class="r">${rp(arrearSum(m))}</td></tr>`).join('')}<tr><th colspan="4">Total</th><th class="r">${rp(tgs.reduce((a,m)=>a+arrearSum(m),0))}</th></tr></table>`:'<p>Tidak ada tunggakan.</p>'}`;
 const tgl=new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
 let o=$('#rep');if(o)o.remove();o=document.createElement('div');o.id='rep';
 o.innerHTML=`<div class="tb"><button onclick="print()">🖨 Cetak / Simpan PDF</button><button class="s" onclick="$('#rep').remove()">✕ Tutup</button></div><div class="pg">
 <div class="kop">${logo?`<img src="${logo.src}">`:''}<div><b>IKATAN PEMUDA MEKARJAYA (IKPM)</b><br>LAPORAN KEUANGAN — ${per.toUpperCase()}<br><small>Dicetak ${tgl}</small></div></div>
 <table class="sum"><tr><td>Saldo awal</td><td class="r">${rp(awal)}</td></tr><tr><td>Total pemasukan</td><td class="r">${rp(mi)}</td></tr><tr><td>Total pengeluaran</td><td class="r">${rp(mo)}</td></tr><tr><th>Saldo akhir</th><th class="r">${rp(awal+mi-mo)}</th></tr></table>
 ${rk}${tg}<h4>Buku Kas Umum</h4><table><tr><th>Tanggal</th><th>Uraian</th><th>Kategori</th><th>Masuk</th><th>Keluar</th><th>Saldo</th></tr><tr><td colspan="5"><i>Saldo awal</i></td><td class="r">${rp(awal)}</td></tr>${rows||'<tr><td colspan="6">Belum ada transaksi.</td></tr>'}</table>
 <div class="ttd"><div>Mengetahui,<br>Ketua IKPM<br><br><br><br>( ........................ )</div><div>Mekarjaya, ${tgl}<br>Bendahara<br><br><br><br>( ........................ )</div></div></div>`;
 document.body.appendChild(o)}
function addMem(){const n=$('#mn').value.trim();if(!n)return toast('Isi nama anggota.');w(async()=>{await col('members').add({name:n,rt:$('#mr').value,role:$('#mo').value,since:+$('#ms').value});R()},'Anggota ditambahkan.')}
function delMem(id){if(confirm('Hapus anggota ini?'))w(()=>col('members').doc(id).delete(),'Anggota dihapus.')}
function editTarif(){
  if(!S.admin) return;
  const t = prompt("Masukkan nominal Tarif Dasar Iuran per tahun (angka saja, tanpa titik):", IURAN);
  if(t && Number(t) > 0){
    w(async() => await col('settings').doc('app').set({iuran: Number(t)}), "Tarif iuran diperbarui.");
  }
}
function iuran(id){if(!S.coll)return toast('Anda tidak punya izin mencatat iuran.');const m=S.mem.find(x=>x.id===id),y=S.year,on=!(m.iuran && m.iuran[y]),r=col('iuran').doc(`${id}_${y}`);
 (async()=>{try{if(on)await r.set({memberId:id,name:m.name,rt:m.rt,year:y,date:y===String(new Date().getFullYear())?today():`${y}-12-31`,amount:tagihan(m,y),by:S.uid});else await r.delete();toast(on?'Iuran lunas & tercatat di kas.':'Iuran dibatalkan, kas dikoreksi.')}catch(e){toast('Gagal: '+(e.message||e.code))}})()}
function loans(){const L=S.loan.filter(l=>S.loanTab==='aktif'?l.status==='unpaid':l.status==='paid').sort((a,b)=>b.date.localeCompare(a.date));
 return `<div class="top"><div><h3 style="margin:0">Pinjaman Kas</h3><span class="mu">Bunga ${BUNGA*100}% dari pokok</span></div></div>
 ${S.admin?`<div class="card"><h3>Pinjaman Baru</h3><div class="f"><select id="lm"><option value="">— Pilih anggota —</option>${S.mem.map(m=>`<option value="${m.id}">${esc(m.name)} (${esc(m.rt)})</option>`).join('')}</select><input id="la" type="number" inputmode="numeric" min="1" placeholder="Pokok pinjaman (Rp)" oninput="$('#lp').textContent=this.value>0?'Total kembali: '+rp(this.value*${1+BUNGA}):''"><div class="mu" id="lp"></div><button onclick="addLoan()">Catat Pinjaman</button><div class="mu">Pokok otomatis tercatat sebagai pengeluaran kas.</div></div></div>`:''}
 <div class="tabs"><button class="${S.loanTab==='aktif'?'a':''}" onclick="S.loanTab='aktif';R()">Belum lunas (${S.loan.filter(l=>l.status==='unpaid').length})</button><button class="${S.loanTab==='lunas'?'a':''}" onclick="S.loanTab='lunas';R()">Riwayat lunas</button></div>
 <div class="card">${L.map(l=>`<div class="row"><div class="g"><b>${esc(l.memberName)}</b><span class="mu">${esc(l.date)} • Pokok ${rp(l.amount)} + bunga ${rp(l.interest)}</span></div><span class="amt ${l.status==='unpaid'?'out':'in'}">${rp(l.total)}</span>${S.admin?(l.status==='unpaid'?`<button class="s" onclick="payLoan('${l.id}')">Lunasi</button>`:'')+`<button class="d" onclick="delLoan('${l.id}')">🗑</button>`:''}</div>`).join('')||'<div class="mu">Kosong.</div>'}</div>`}
function addLoan(){const m=S.mem.find(x=>x.id===$('#lm').value),a=+$('#la').value;if(!m||!(a>0))return toast('Pilih anggota dan isi nominal.');
 const i=Math.round(a*BUNGA),id=col('loans').doc().id;
 w(async()=>{await col('loans').doc(id).set({memberId:m.id,memberName:m.name,amount:a,interest:i,total:a+i,status:'unpaid',date:today()});
  await col('transactions').doc('out_'+id).set({type:'expense',amount:a,category:'Pinjaman Anggota',description:'Pinjaman - '+m.name,date:today(),createdAt:new Date().toISOString()});R()},'Pinjaman dicatat.')}
function payLoan(id){const l=S.loan.find(x=>x.id===id);if(!confirm(`Terima pelunasan ${rp(l.total)} dari ${l.memberName}?`))return;
 w(async()=>{await col('loans').doc(id).update({status:'paid',paidAt:today()});await col('transactions').doc('in_'+id).set({type:'income',amount:l.total,category:'Pelunasan Pinjaman',description:`Pelunasan pinjaman - ${l.memberName} (bunga ${rp(l.interest)})`,date:today(),createdAt:new Date().toISOString()})},'Pinjaman lunas & kas diperbarui.')}
function delLoan(id){if(!confirm('Hapus pinjaman beserta catatan kasnya?'))return;w(async()=>{await col('loans').doc(id).delete();await col('transactions').doc('out_'+id).delete();await col('transactions').doc('in_'+id).delete()},'Pinjaman dihapus.')}
const RTS=['RT Mekarjaya','RT Cipancur'];
function rekapData(){const y=S.year;return RTS.map(rt=>{const m=S.mem.filter(x=>x.rt===rt),t=m.filter(x=>x.role==='Anggota Tetap'),l=t.filter(x=>x.iuran && x.iuran[y]);return{rt,m,total:m.length,tetap:t.length,donatur:m.length-t.length,lunas:l.length,belum:t.filter(x=>!(x.iuran && x.iuran[y])),kas:l.reduce((a,x)=>a+((x.iuran && x.iuran[y])?x.iuran[y].amount:tagihan(x,y)),0),don:m.reduce((a,x)=>a+(x.don||[]).filter(d=>d.year===y).reduce((b,d)=>b+d.amount,0),0),tg:t.filter(x=>arrears(x).length),target:t.reduce((a,x)=>a+tagihan(x,y),0)}})}
function rekap(){if(S.year==='all')return `<div class="top"><h3 style="margin:0">Rekap per RT</h3>${yearSel()}</div><div class="card">Pilih satu tahun untuk melihat rekap iuran per RT.</div>`;
 const D=rekapData(),g=D.reduce((a,d)=>a+d.kas,0),tg=D.reduce((a,d)=>a+d.target,0);
 return `<div class="top"><h3 style="margin:0">Rekap Iuran ${S.year}</h3>${yearSel()}</div>
 <div class="card hero"><div class="mu" style="color:#cfe0ff">Terkumpul dari target</div><h2>${rp(g)} <span style="font-size:15px;opacity:.8">/ ${rp(tg)}</span></h2></div>
 <div class="card np adm" style="display:flex;gap:8px;flex-wrap:wrap"><button class="s" onclick="csvRekap()">⬇ Ekspor Semua RT</button>${RTS.map(r=>`<button class="s" onclick="csvRekap('${r}')">⬇ ${r}</button>`).join('')}<button class="s" onclick="laporan()">🖨 Laporan (PDF)</button></div>
 <div class="grid c2">${D.map(d=>`<div class="card"><h3>${d.rt}</h3><div class="mu">${d.total} anggota • ${d.tetap} tetap • ${d.donatur} donatur</div>
 <div class="row"><div class="g">Lunas</div><b class="in">${d.lunas} / ${d.tetap}</b></div><div class="row"><div class="g">Terkumpul</div><b>${rp(d.kas)}</b></div><div class="row"><div class="g">Belum lunas</div><b class="out">${d.belum.length} orang</b></div><div class="row"><div class="g">Menunggak tahun lalu</div><b class="out">${d.tg.length} orang • ${rp(d.tg.reduce((a,x)=>a+arrearSum(x),0))}</b></div>
 ${d.belum.length?`<div class="mu" style="margin-top:8px">${d.belum.map(x=>esc(x.name)).join(', ')}</div>`:''}</div>`).join('')}</div>`}
async function csvRekap(rt){if(!S.admin)return;const d=DL;if(!d)return toast('Unduh tidak tersedia di tampilan ini.');
 const rows=[['RT','Nama','Peran','Iuran '+S.year,'Nominal'],...rekapData().filter(x=>!rt||x.rt===rt).flatMap(x=>x.m.map(m=>[x.rt,m.name,m.role,m.role==='Anggota Tetap'?((m.iuran && m.iuran[S.year])?'Lunas':'Belum'):'-',m.role==='Anggota Tetap' && (m.iuran && m.iuran[S.year])?((m.iuran && m.iuran[S.year].amount)?m.iuran[S.year].amount:tagihan(m,S.year)):0]))];
 const data=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
 try{await d.save({filename:`rekap-iuran-${rt?rt.replace(' ','-'):'semua-rt'}-${S.year}.csv`,data})}catch(e){}}
const TABS=[['home','🏠','Beranda'],['members','👥','Anggota'],['add','➕','Catat'],['loans','🤝','Pinjaman'],['kas','📒','Buku Kas'],['rekap','📊','Rekap RT']];
function R(){if(S.tab==='add'&&!S.admin)S.tab='home';document.body.classList.toggle('isadmin',!!S.admin);$('#nav').innerHTML=TABS.filter(t=>t[0]!=='add'||S.admin).map(([k,i,l])=>`<button class="${S.tab===k?'a':''}" onclick="go('${k}')"><span>${i}</span>${l}</button>`).join('');
 $('#v').innerHTML=!S.db?`<div class="card">Memuat data… Jika terlalu lama, periksa koneksi internet.</div>`:{home,members,add,loans,kas,rekap}[S.tab]();
 $('#st').textContent=!S.db?'memuat…':S.admin?'🔓 Admin':S.coll?'✏️ Penarik Iuran':S.user?'⚠️ Belum terdaftar':'🔒 Mode baca';const b=$('#lg');if(b)b.textContent=S.user?'🚪':'🔑';b.title=S.user?'Keluar':'Masuk Admin'}
function go(t){if(t==='add'&&!S.admin)return toast('Hanya Admin yang dapat mencatat.');S.tab=t;S.q='';R();scrollTo(0,0)}
window.fbReadyP=new Promise(r=>window.fbResolve=r);

/* ====== ISI EMAIL PENGURUS DI SINI ====== */
const CFG=window.IKPM_CONFIG||{};const ADMINS=(CFG.ADMINS||[]).map(e=>e.trim().toLowerCase());const COLLECTORS=(CFG.COLLECTORS||[]).map(e=>e.trim().toLowerCase());
const norm=e=>(e||'').trim().toLowerCase();
const DL={save:async({filename,data})=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+data],{type:'text/csv;charset=utf-8'}));a.download=filename;document.body.appendChild(a);a.click();a.remove()}};
function authBtn(){if(S.user){S.db.logout();toast('Anda sudah keluar.');return}
 const o=document.createElement('div');o.id='lgm';o.style.cssText='position:fixed;inset:0;background:#000a;z-index:30;display:grid;place-items:center;padding:16px';
 o.innerHTML=`<form class="card" style="width:100%;max-width:340px;margin:0" onsubmit="return doLogin(event)"><h3>Masuk Pengurus</h3><div class="f"><input id="le" type="email" placeholder="Email" autocomplete="username" required><input id="lp2" type="password" placeholder="Kata sandi" autocomplete="current-password" required><button>Masuk</button><button type="button" class="s" onclick="this.closest('#lgm').remove()">Batal</button></div></form>`;document.body.appendChild(o);$('#le').focus()}
async function doLogin(e){e.preventDefault();try{await S.db.login($('#le').value.trim(),$('#lp2').value);$('#lgm').remove();toast('Berhasil masuk.')}catch(x){toast('Email atau kata sandi salah.')}return false}

// Inisialisasi Utama
(async()=>{
  R();
  const api=await Promise.race([window.fbReadyP,new Promise(r=>setTimeout(()=>r(null),12000))]);
  if(!api){toast('Tidak dapat terhubung ke Firebase.');return}
  S.db=api;
  
  api.onAuth(u=>{
    S.user=u;
    const m=norm(u&&u.email);
    S.admin=ADMINS.includes(m);
    S.owner=S.admin;
    S.coll=S.admin||COLLECTORS.includes(m);
    S.uid=u?u.uid:'';
    if(u&&!S.coll)toast('Email '+u.email+' belum terdaftar sebagai pengurus.');
    R();
  });
  
  const sub=(n,k)=>col(n).onSnapshot(s=>{S[k]=s.docs.map(d=>({id:d.id,...d.data()}));sync();R()},e=>toast('Gagal memuat data (cek aturan Firestore).'));
  
  sub('transactions','tx');
  sub('members','mem');
  sub('loans','loan');
  sub('iuran','iur');
  
  col('settings').onSnapshot(s => { 
    const d = s.docs.find(x => x.id === 'app'); 
    if(d) { IURAN = d.data().iuran || 25000; } 
    R(); 
  });
  
  R();
})();
</script>
